name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'app/src-tauri/**'
              - 'app/package-lock.json'
              - 'app/vite.config.*'
              - 'app/src/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (pytest)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Tesseract (OCR fallback, pytesseract wraps the binary)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: |
            backend/models/bge-small-en-v1.5-onnx
            ~/.cache/huggingface
          key: embedding-${{ hashFiles('backend/scripts/convert_embedding_model.py', 'backend/uv.lock') }}

      - name: Install dependencies
        working-directory: backend
        # Copy instead of hardlink from the uv cache: nltk's pathsec refuses
        # files with st_nlink > 1 when it loads its bundled stopwords.
        env:
          UV_LINK_MODE: copy
        run: uv sync --all-groups

      - name: Generate the embedding model
        # Public Hugging Face checkpoint, no secrets needed — gives
        # test_embeddings.py real coverage in CI instead of skipping.
        # Canvas-fixture-dependent tests (test_ingestion.py) still skip
        # cleanly here, same as local dev without a Canvas token — CI never
        # gets a real Canvas or OpenAI credential.
        working-directory: backend
        run: |
          if [ ! -f models/bge-small-en-v1.5-onnx/model.onnx ]; then
            uv run python3 scripts/convert_embedding_model.py
          fi

      - name: Run tests
        working-directory: backend
        run: |
          args=(-v)
          if [ "${{ github.event_name }}" != "push" ]; then
            args+=(-m "not integration")
          fi
          uv run pytest tests/ "${args[@]}"

  frontend:
    name: Frontend (typecheck + build)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Build
        working-directory: app
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: app/dist
          retention-days: 1

  rust:
    name: Tauri shell (cargo check)
    needs: [changes, frontend]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: app/dist

      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check
