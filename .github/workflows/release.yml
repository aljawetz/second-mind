name: Release

on:
  push:
    tags:
      - "v*"

# contents: write — real finding from the first actual run: this repo's
# default GITHUB_TOKEN permissions don't include creating a release
# ("Resource not accessible by integration"), which isn't obvious until a
# tag push actually fails on it.
permissions:
  contents: write

# macOS only, unsigned — contribution-and-distribution-plan.md step 5. An
# unsigned .dmg triggers Gatekeeper on first install: either "Apple cannot
# verify this app" (right-click -> Open bypasses it) or, more often on
# recent macOS, "SSB is damaged and can't be opened" (right-click -> Open
# does NOT bypass this one; requires `xattr -cr` on the app, documented in
# the release body below). Real notarization needs a paid Apple Developer
# account and is deliberately deferred rather than blocking a first
# release on it.
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Two-phase deps deliberately, not `uv sync --all-groups` once:
      # backend/README.md's own documented finding (implementation-plan.md
      # Step 4) — building the sidecar from an environment that also has
      # the `convert` group installed (optimum, pulled in only to run the
      # ONNX export) silently bundles torch into the shipped binary. The
      # embedding model is generated in one environment, then the
      # environment is fully reconciled to build-only before PyInstaller
      # ever runs.
      - name: Generate the embedding model
        working-directory: backend
        run: |
          uv sync --group convert
          uv run python3 scripts/convert_embedding_model.py

      - name: Fetch the session-transcription model
        working-directory: backend
        run: uv run python3 scripts/fetch_whisper_model.py

      - name: Build the sidecar binary
        working-directory: backend
        run: |
          uv sync --group build
          uv run --group build pyinstaller ssb-backend.spec --distpath dist --workpath build

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Copy sidecar into the Tauri bundle
        run: |
          mkdir -p app/src-tauri/binaries
          cp backend/dist/ssb-backend-aarch64-apple-darwin app/src-tauri/binaries/ssb-backend-aarch64-apple-darwin

      - name: Build the Tauri app (.dmg)
        working-directory: app
        run: npm run tauri build

      # Real bug found in v0.1.0: Tauri's bundler never re-signs the
      # assembled .app after copying in Contents/Resources (icon.icns) --
      # the only signature present is the Rust linker's automatic ad-hoc
      # signature from compile time, whose CodeDirectory claims resources
      # are sealed when no _CodeSignature dir actually exists. That
      # mismatch is exactly what macOS reports as "SSB is damaged and
      # can't be opened" -- not a Gatekeeper false positive, an actually
      # invalid signature on the shipped bundle. Fix: ad-hoc re-sign the
      # finished bundle, then rebuild the .dmg from the corrected .app
      # instead of trusting Tauri's already-broken .dmg output.
      - name: Fix the code signature and repackage the .dmg
        working-directory: app
        run: |
          APP="src-tauri/target/release/bundle/macos/SSB.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname SSB -srcfolder "$APP" -ov -format UDZO "$DMG_DIR/SSB.dmg"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          body: |
            **Unsigned build** (not notarized by Apple). macOS Gatekeeper will block it on first
            launch. Fastest fix, open Terminal and run:
            ```
            xattr -cr /Applications/SSB.app
            ```
            (point it at wherever you placed `SSB.app` if not yet in Applications), then open it
            normally.

            If you'd rather not use Terminal, depending on your macOS version you'll see one of
            these, each with its own bypass:

            - **"Apple could not verify '[App]' is free of malware..."** (current macOS) — no
              inline bypass. Try to open it once (blocked), then System Settings → Privacy &
              Security → scroll to "'SSB' was blocked to protect your Mac" → **Open Anyway** →
              try opening it again and confirm.
            - **"Apple cannot verify this app"** (older macOS, has an inline "Open Anyway") —
              right-click the app → Open, then confirm.

            Only needed once per download. See
            [docs/architecture/contribution-and-distribution-plan.md](https://github.com/${{ github.repository }}/blob/main/docs/architecture/contribution-and-distribution-plan.md)
            for why this isn't notarized yet.

            **Tesseract required separately for OCR fallback on image-heavy slides**
            (`brew install tesseract`) — not bundled into this build yet
            (implementation-plan.md Step 5's real finding: `pytesseract` only wraps the system
            binary, PyInstaller doesn't pick it up).
