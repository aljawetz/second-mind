[project]
name = "ssb-backend"
version = "0.1.0"
description = "SSB local backend — sidecar spawned by the Tauri app"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "keyring>=25.7",
    "llama-index-core>=0.12",
    "llama-index-llms-openai>=0.3",
    "llama-index-vector-stores-lancedb>=0.3",
    "onnxruntime>=1.20",
    # llama_index.vector_stores.lancedb imports this at module level but
    # doesn't declare it as a dependency — confirmed missing by actually
    # running the frozen build, not just checking it compiled.
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "pytesseract>=0.3",
    "tokenizers>=0.21",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
# Split deliberately: PyInstaller bundles whatever's importable in the venv
# it runs from, not just what main.py actually needs — building from an
# environment that also has `convert` installed silently bundled torch into
# the frozen binary (confirmed by actually checking, implementation-plan.md
# Step 4). `uv sync --group build` must never pull in `convert`.
build = [
    "pyinstaller>=6.22",
]
test = [
    "pytest>=8.3",
    "respx>=0.22",
]
# Conversion-time only (scripts/convert_embedding_model.py). optimum[onnx]
# pulls torch to run the export; onnxruntime here validates the result.
convert = [
    "optimum[onnx]",
    "onnx>=1.17",
]

[tool.pytest.ini_options]
pythonpath = ["."]
