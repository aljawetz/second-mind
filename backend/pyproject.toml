[project]
name = "ssb-backend"
version = "0.1.0"
description = "SSB local backend — sidecar spawned by the Tauri app"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "keyring>=25.7",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest>=8.3",
    "respx>=0.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
