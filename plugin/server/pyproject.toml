# The Claude Code plugin's MCP server as an installable package (plan
# docs/plans/2026-11-13-claude-code-plugin.md, Decision 4). Claude Code starts
# it with `uvx --from <this directory or its git URL> sm-mcp`, so a student
# never checks out the repo or installs the app.
#
# The code is the app's own backend modules, copied in at build time (the
# force-include list below), so there is one copy of the search and sync code.
# Only the modules on the plugin's path are listed, and none of the app's LLM
# stack: tests/test_plugin_imports.py fails if the server ever imports it.
[project]
name = "second-mind-mcp"
dynamic = ["version"]
description = "Second Mind for Claude Code: search and deadlines from your own Canvas courses"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3",
    "httpx>=0.28",
    "keyring>=25.7",
    "llama-index-core>=0.12",
    "llama-index-vector-stores-lancedb>=0.3",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "tokenizers>=0.21",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pytesseract>=0.3",
]

[project.scripts]
sm-mcp = "mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
# 0.1.0+<hash of the backend code>: uvx reuses an env by name and version, so
# without the hash a code change would keep running the old build.
source = "code"
path = "version.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"../../backend/mcp_server.py" = "mcp_server.py"
"../../backend/assignments.py" = "assignments.py"
"../../backend/canvas.py" = "canvas.py"
"../../backend/citation_links.py" = "citation_links.py"
"../../backend/config.py" = "config.py"
"../../backend/course_sync.py" = "course_sync.py"
"../../backend/credentials.py" = "credentials.py"
"../../backend/embeddings.py" = "embeddings.py"
"../../backend/generation.py" = "generation.py"
"../../backend/indexing.py" = "indexing.py"
"../../backend/ingestion.py" = "ingestion.py"
"../../backend/model_download.py" = "model_download.py"
"../../backend/query_dates.py" = "query_dates.py"
"../../backend/reranker.py" = "reranker.py"
"../../backend/study.py" = "study.py"
"../../backend/sync.py" = "sync.py"
"../../backend/sync_jobs.py" = "sync_jobs.py"

[tool.uv]
# The code lives in ../../backend, outside this folder, so uv must watch it
# too; otherwise `uvx --from ./plugin/server` keeps running a stale build.
cache-keys = [{ file = "pyproject.toml" }, { file = "../../backend/*.py" }]
